<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重複画像クリーナー (DupImage Finder)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .group-container { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Custom scrollbar for better PWA feel */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        
        .image-card.marked-delete { outline: 3px solid #ef4444; background-color: #fef2f2; }
    </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col">

    <!-- Header / Control Bar -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                DupImage Finder
            </h1>
            
            <div class="flex flex-wrap gap-2">
                <button id="btn-select-folder" class="bg-white text-indigo-600 hover:bg-indigo-50 px-4 py-2 rounded-lg font-medium transition-colors shadow flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
                    </svg>
                    フォルダを選択
                </button>
                <button id="btn-batch-select" class="bg-indigo-500 hover:bg-indigo-400 text-white px-4 py-2 rounded-lg font-medium transition-colors shadow disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    DupFileを一括選択
                </button>
                <button id="btn-delete" class="bg-red-500 hover:bg-red-400 text-white px-4 py-2 rounded-lg font-medium transition-colors shadow flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                    選択した画像を削除
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        
        <!-- API Not Supported Warning -->
        <div id="not-supported-msg" class="hidden bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-6" role="alert">
            <p class="font-bold">非対応ブラウザ</p>
            <p>お使いのブラウザは File System Access API に対応していません。Chrome、Edge、またはOperaを使用してください。</p>
        </div>

        <!-- Initial State -->
        <div id="initial-state" class="text-center py-20">
            <svg xmlns="http://www.w3.org/2000/svg" class="mx-auto h-16 w-16 text-gray-400 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
            </svg>
            <h2 class="text-2xl font-semibold text-gray-700 mb-2">フォルダを選択してスキャン開始</h2>
            <p class="text-gray-500 max-w-md mx-auto">画質や圧縮率が異なっていても、画像データの特徴から重複ファイルを探し出します。</p>
        </div>

        <!-- Progress Area -->
        <div id="progress-area" class="hidden bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-8">
            <h3 class="text-lg font-medium text-gray-800 mb-4" id="progress-text">画像をスキャン中... (0 / 0)</h3>
            <div class="w-full bg-gray-200 rounded-full h-3 mb-2">
                <div id="progress-bar" class="bg-indigo-600 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <p class="text-sm text-gray-500" id="progress-detail">処理を準備しています...</p>
        </div>

        <!-- Results Area -->
        <div id="results-area" class="hidden space-y-8">
            <!-- Groups will be injected here -->
        </div>

        <!-- No Duplicates Message -->
        <div id="no-duplicates-msg" class="hidden text-center py-16 bg-white rounded-xl shadow-sm border border-gray-200">
            <div class="text-4xl mb-4">🎉</div>
            <h2 class="text-xl font-semibold text-gray-700">重複画像は見つかりませんでした</h2>
            <p class="text-gray-500 mt-2">指定されたフォルダ内は整理されています。</p>
        </div>

    </main>

    <!-- Custom Message Box (Replaces alert/confirm) -->
    <div id="message-modal" class="fixed inset-0 bg-black bg-opacity-50 z-[100] hidden flex items-center justify-center backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 mx-4 transform scale-95 transition-transform" id="message-modal-content">
            <h3 class="text-xl font-bold text-gray-900 mb-2" id="message-title">通知</h3>
            <p class="text-gray-600 mb-6" id="message-body">メッセージ内容</p>
            <div class="flex justify-end gap-3" id="message-actions">
                <button id="msg-btn-ok" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg font-medium transition-colors">OK</button>
            </div>
        </div>
    </div>

    <script>
        // --- Application State ---
        const AppState = {
            dirHandle: null,
            imagesMap: {}, // Map internal ID to image data (for deletion)
            duplicateGroups: [],
            isProcessing: false
        };

        // --- DOM Elements ---
        const UI = {
            btnSelectFolder: document.getElementById('btn-select-folder'),
            btnBatchSelect: document.getElementById('btn-batch-select'),
            btnDelete: document.getElementById('btn-delete'),
            initialState: document.getElementById('initial-state'),
            progressArea: document.getElementById('progress-area'),
            progressText: document.getElementById('progress-text'),
            progressBar: document.getElementById('progress-bar'),
            progressDetail: document.getElementById('progress-detail'),
            resultsArea: document.getElementById('results-area'),
            noDuplicatesMsg: document.getElementById('no-duplicates-msg'),
            notSupportedMsg: document.getElementById('not-supported-msg'),
            // Modal
            modal: document.getElementById('message-modal'),
            modalContent: document.getElementById('message-modal-content'),
            modalTitle: document.getElementById('message-title'),
            modalBody: document.getElementById('message-body'),
            modalActions: document.getElementById('message-actions')
        };

        // --- Check Browser Support ---
        if (!('showDirectoryPicker' in window)) {
            UI.notSupportedMsg.classList.remove('hidden');
            UI.btnSelectFolder.disabled = true;
        }

        // --- Custom Message Box ---
        function showMessage(title, message, isConfirm = false, onConfirm = null) {
            UI.modalTitle.textContent = title;
            UI.modalBody.textContent = message;
            UI.modalActions.innerHTML = ''; // Clear previous buttons

            if (isConfirm) {
                const cancelBtn = document.createElement('button');
                cancelBtn.textContent = 'キャンセル';
                cancelBtn.className = 'bg-gray-200 hover:bg-gray-300 text-gray-800 px-5 py-2 rounded-lg font-medium transition-colors';
                cancelBtn.onclick = () => hideMessage();

                const confirmBtn = document.createElement('button');
                confirmBtn.textContent = '実行';
                confirmBtn.className = 'bg-red-500 hover:bg-red-600 text-white px-5 py-2 rounded-lg font-medium transition-colors';
                confirmBtn.onclick = () => {
                    hideMessage();
                    if (onConfirm) onConfirm();
                };

                UI.modalActions.appendChild(cancelBtn);
                UI.modalActions.appendChild(confirmBtn);
            } else {
                const okBtn = document.createElement('button');
                okBtn.textContent = 'OK';
                okBtn.className = 'bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg font-medium transition-colors';
                okBtn.onclick = () => hideMessage();
                UI.modalActions.appendChild(okBtn);
            }

            UI.modal.classList.remove('hidden');
            setTimeout(() => {
                UI.modal.classList.remove('bg-opacity-0');
                UI.modalContent.classList.remove('scale-95');
                UI.modalContent.classList.add('scale-100');
            }, 10);
        }

        function hideMessage() {
            UI.modalContent.classList.remove('scale-100');
            UI.modalContent.classList.add('scale-95');
            setTimeout(() => {
                UI.modal.classList.add('hidden');
            }, 200);
        }

        // --- Utilities ---
        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        // Generate a random ID for internal tracking
        function generateId() {
            return Math.random().toString(36).substr(2, 9);
        }

        // Hamming distance for dHash comparison
        function hammingDistance(hash1, hash2) {
            let distance = 0;
            for (let i = 0; i < hash1.length; i++) {
                if (hash1[i] !== hash2[i]) {
                    distance++;
                }
            }
            return distance;
        }

        // Create a lightweight thumbnail dataURL from an Image object
        function generateThumbnail(img) {
            const canvas = document.createElement('canvas');
            const MAX_SIZE = 250;
            let width = img.width;
            let height = img.height;
            
            if (width > height) {
                if (width > MAX_SIZE) {
                    height *= MAX_SIZE / width;
                    width = MAX_SIZE;
                }
            } else {
                if (height > MAX_SIZE) {
                    width *= MAX_SIZE / height;
                    height = MAX_SIZE;
                }
            }
            
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            return canvas.toDataURL('image/jpeg', 0.6); // 60% quality for small thumb
        }

        // Compute Difference Hash (dHash) - 64 bit string
        function computeDHash(img) {
            const canvas = document.createElement('canvas');
            // dHash uses 9x8 grid to compare adjacent pixels (8 comparisons per row = 64 bits)
            canvas.width = 9;
            canvas.height = 8;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            
            // Draw image scaled down to 9x8
            ctx.drawImage(img, 0, 0, 9, 8);
            const imageData = ctx.getImageData(0, 0, 9, 8).data;
            
            let hash = '';
            
            for (let y = 0; y < 8; y++) {
                for (let x = 0; x < 8; x++) {
                    const leftIdx = (y * 9 + x) * 4;
                    const rightIdx = (y * 9 + (x + 1)) * 4;
                    
                    // Convert to grayscale: 0.299*R + 0.587*G + 0.114*B
                    const leftGray = 0.299 * imageData[leftIdx] + 0.587 * imageData[leftIdx + 1] + 0.114 * imageData[leftIdx + 2];
                    const rightGray = 0.299 * imageData[rightIdx] + 0.587 * imageData[rightIdx + 1] + 0.114 * imageData[rightIdx + 2];
                    
                    hash += leftGray > rightGray ? '1' : '0';
                }
            }
            return hash;
        }

        // Process a single file to extract metadata and hash
        function processImage(file, fileHandle) {
            return new Promise((resolve) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                
                img.onload = () => {
                    const width = img.width;
                    const height = img.height;
                    const hash = computeDHash(img);
                    const thumbUrl = generateThumbnail(img);
                    const id = generateId();
                    
                    URL.revokeObjectURL(url); // Free memory
                    
                    resolve({
                        id,
                        fileHandle,
                        name: file.name,
                        size: file.size,
                        width,
                        height,
                        hash,
                        thumbUrl,
                        isOriginal: false // Will be determined later
                    });
                };
                
                img.onerror = () => {
                    URL.revokeObjectURL(url);
                    resolve(null); // Not a valid image or corrupted
                };
                
                img.src = url;
            });
        }

        // --- Main Logic ---

        // 1. Select Folder and trigger scan
        UI.btnSelectFolder.addEventListener('click', async () => {
            if (AppState.isProcessing) return;
            
            try {
                // Request access to read/write a directory
                AppState.dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
                await startScanning();
            } catch (error) {
                if (error.name !== 'AbortError') {
                    console.error(error);
                    showMessage('エラー', 'フォルダへのアクセスが拒否されたか、エラーが発生しました。');
                }
            }
        });

        // 2. Scan Directory and Process Images
        async function startScanning() {
            AppState.isProcessing = true;
            AppState.imagesMap = {};
            AppState.duplicateGroups = [];
            
            // Update UI
            UI.initialState.classList.add('hidden');
            UI.resultsArea.classList.add('hidden');
            UI.noDuplicatesMsg.classList.add('hidden');
            UI.progressArea.classList.remove('hidden');
            UI.btnBatchSelect.disabled = true;
            UI.btnDelete.disabled = true;
            UI.resultsArea.innerHTML = '';
            
            UI.progressDetail.textContent = 'フォルダ内のファイルをリストアップ中...';
            UI.progressBar.style.width = '0%';
            
            const imageHandles = [];
            const allowedExtensions = /\.(jpe?g|png|webp|gif|bmp)$/i;

            // Iterate over all entries in the folder
            for await (const entry of AppState.dirHandle.values()) {
                if (entry.kind === 'file' && allowedExtensions.test(entry.name)) {
                    imageHandles.push(entry);
                }
            }

            const totalFiles = imageHandles.length;
            if (totalFiles === 0) {
                finishScanning(0);
                return;
            }

            UI.progressText.textContent = `画像を解析中... (0 / ${totalFiles})`;
            
            const processedImages = [];
            let completed = 0;

            // Process files one by one to avoid overwhelming memory/CPU
            for (const handle of imageHandles) {
                try {
                    const file = await handle.getFile();
                    UI.progressDetail.textContent = `解析中: ${file.name}`;
                    
                    const imgData = await processImage(file, handle);
                    if (imgData) {
                        processedImages.push(imgData);
                    }
                } catch (err) {
                    console.warn(`Failed to process ${handle.name}`, err);
                }
                
                completed++;
                UI.progressText.textContent = `画像を解析中... (${completed} / ${totalFiles})`;
                UI.progressBar.style.width = `${(completed / totalFiles) * 100}%`;
                
                // Yield to main thread to keep UI responsive
                await new Promise(resolve => setTimeout(resolve, 0));
            }

            // 3. Find Duplicates
            UI.progressDetail.textContent = '類似画像を比較・グループ化中...';
            await findDuplicates(processedImages);
            
            finishScanning(processedImages.length);
        }

        // Group images based on dHash Hamming distance
        async function findDuplicates(processedImages) {
            const groups = [];
            const THRESHOLD = 8; // Max bit differences to consider as duplicate (out of 64)

            for (const img of processedImages) {
                let foundGroup = false;
                for (const group of groups) {
                    // Compare with the first image of the group
                    const distance = hammingDistance(img.hash, group[0].hash);
                    if (distance <= THRESHOLD) {
                        group.push(img);
                        foundGroup = true;
                        break;
                    }
                }
                if (!foundGroup) {
                    groups.push([img]);
                }
            }

            // Keep only groups with > 1 images
            const dupGroups = groups.filter(g => g.length > 1);

            // Determine Original (highest res, then file size) and DupFile
            dupGroups.forEach(group => {
                group.sort((a, b) => {
                    const resA = a.width * a.height;
                    const resB = b.width * b.height;
                    if (resA !== resB) return resB - resA; // Larger resolution first
                    return b.size - a.size; // Larger file size first if resolution is equal
                });
                
                group[0].isOriginal = true;
                for (let i = 1; i < group.length; i++) {
                    group[i].isOriginal = false;
                }
                
                // Store in AppState map for easy access during deletion
                group.forEach(img => {
                    AppState.imagesMap[img.id] = img;
                });
            });

            AppState.duplicateGroups = dupGroups;
        }

        function finishScanning(totalProcessed) {
            UI.progressArea.classList.add('hidden');
            AppState.isProcessing = false;

            if (AppState.duplicateGroups.length === 0) {
                UI.noDuplicatesMsg.classList.remove('hidden');
            } else {
                renderResults();
                UI.resultsArea.classList.remove('hidden');
                UI.btnBatchSelect.disabled = false;
                UI.btnDelete.disabled = false;
            }
        }

        // --- Render UI ---
        function renderResults() {
            UI.resultsArea.innerHTML = '';

            AppState.duplicateGroups.forEach((group, index) => {
                const groupEl = document.createElement('div');
                groupEl.className = 'group-container bg-white p-6 rounded-xl shadow-sm border border-gray-200';
                groupEl.id = `group-${index}`;
                
                const groupHeader = document.createElement('div');
                groupHeader.className = 'flex justify-between items-center border-b border-gray-100 pb-3 mb-4';
                groupHeader.innerHTML = `<h3 class="text-lg font-semibold text-gray-700">重複グループ ${index + 1} <span class="text-sm font-normal text-gray-400 ml-2">(${group.length}枚)</span></h3>`;
                groupEl.appendChild(groupHeader);

                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6';

                group.forEach(img => {
                    const card = document.createElement('div');
                    card.className = `image-card relative border rounded-lg overflow-hidden transition-all duration-200 hover:shadow-md ${img.isOriginal ? 'border-green-300' : 'border-gray-200'}`;
                    card.id = `card-${img.id}`;
                    
                    const badge = img.isOriginal 
                        ? `<span class="absolute top-2 right-2 bg-green-500 text-white text-xs font-bold px-2 py-1 rounded shadow">オリジナル (高画質)</span>`
                        : `<span class="absolute top-2 right-2 bg-yellow-500 text-white text-xs font-bold px-2 py-1 rounded shadow">DupFile (複製)</span>`;

                    card.innerHTML = `
                        ${badge}
                        <div class="h-40 bg-gray-100 flex items-center justify-center overflow-hidden">
                            <img src="${img.thumbUrl}" alt="thumbnail" class="object-contain w-full h-full">
                        </div>
                        <div class="p-3 bg-white">
                            <p class="text-sm font-medium text-gray-800 truncate mb-1" title="${img.name}">${img.name}</p>
                            <div class="text-xs text-gray-500 flex justify-between mb-1">
                                <span>${img.width} × ${img.height} px</span>
                                <span>${formatBytes(img.size)}</span>
                            </div>
                            <label class="flex items-center mt-3 cursor-pointer p-2 hover:bg-gray-50 rounded">
                                <input type="checkbox" class="delete-checkbox h-5 w-5 text-indigo-600 rounded border-gray-300 focus:ring-indigo-500 cursor-pointer" data-id="${img.id}" data-role="${img.isOriginal ? 'original' : 'dupfile'}">
                                <span class="ml-2 text-sm font-medium text-gray-700 select-none">削除対象として選択</span>
                            </label>
                        </div>
                    `;

                    // Handle card highlighting when checked
                    const checkbox = card.querySelector('input');
                    checkbox.addEventListener('change', (e) => {
                        if (e.target.checked) {
                            card.classList.add('marked-delete');
                        } else {
                            card.classList.remove('marked-delete');
                        }
                        updateDeleteButtonState();
                    });

                    grid.appendChild(card);
                });

                groupEl.appendChild(grid);
                UI.resultsArea.appendChild(groupEl);
            });
        }

        // --- Interactions ---

        // Batch Select "DupFiles"
        UI.btnBatchSelect.addEventListener('click', () => {
            const checkboxes = document.querySelectorAll('.delete-checkbox');
            checkboxes.forEach(cb => {
                const card = document.getElementById(`card-${cb.dataset.id}`);
                if (cb.dataset.role === 'dupfile') {
                    cb.checked = true;
                    card.classList.add('marked-delete');
                } else {
                    cb.checked = false;
                    card.classList.remove('marked-delete');
                }
            });
            updateDeleteButtonState();
        });

        function updateDeleteButtonState() {
            const checkedCount = document.querySelectorAll('.delete-checkbox:checked').length;
            UI.btnDelete.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
                選択した画像を削除 ${checkedCount > 0 ? `(${checkedCount}件)` : ''}
            `;
        }

        // Delete Selected
        UI.btnDelete.addEventListener('click', () => {
            const checkedBoxes = Array.from(document.querySelectorAll('.delete-checkbox:checked'));
            if (checkedBoxes.length === 0) {
                showMessage('通知', '削除する画像が選択されていません。');
                return;
            }

            showMessage('確認', `選択した ${checkedBoxes.length} 件のファイルを完全に削除しますか？\n（この操作は元に戻せません）`, true, async () => {
                
                UI.btnDelete.disabled = true;
                let deletedCount = 0;
                let errorCount = 0;

                for (const cb of checkedBoxes) {
                    const id = cb.dataset.id;
                    const imageInfo = AppState.imagesMap[id];
                    
                    if (imageInfo) {
                        try {
                            // Actually remove file using File System Access API
                            await AppState.dirHandle.removeEntry(imageInfo.handle.name);
                            
                            // Remove element from DOM gracefully
                            const card = document.getElementById(`card-${id}`);
                            card.style.opacity = '0';
                            setTimeout(() => {
                                card.remove();
                                // Check if group is empty
                                cleanUpEmptyGroups();
                            }, 300);
                            
                            deletedCount++;
                        } catch (err) {
                            console.error(`Error deleting ${imageInfo.name}:`, err);
                            errorCount++;
                        }
                    }
                }
                
                setTimeout(() => {
                    let msg = `${deletedCount} 件のファイルを削除しました。`;
                    if (errorCount > 0) {
                        msg += `\n${errorCount} 件のファイルの削除に失敗しました（権限不足やファイルが使用中の可能性があります）。`;
                    }
                    showMessage('完了', msg);
                    UI.btnDelete.disabled = false;
                    updateDeleteButtonState();
                }, 400);
            });
        });

        // Clean up UI if a group has no images left (or only 1 left which means no longer duplicate)
        function cleanUpEmptyGroups() {
            const groups = document.querySelectorAll('.group-container');
            let hasDuplicatesLeft = false;

            groups.forEach(group => {
                const remainingCards = group.querySelectorAll('.image-card').length;
                if (remainingCards <= 1) { // If 0 or 1 left, it's not a duplicate group anymore
                    group.remove();
                } else {
                    hasDuplicatesLeft = true;
                }
            });

            if (!hasDuplicatesLeft) {
                UI.resultsArea.classList.add('hidden');
                UI.noDuplicatesMsg.classList.remove('hidden');
                UI.btnBatchSelect.disabled = true;
                UI.btnDelete.disabled = true;
            }
        }

    </script>
</body>
</html>
